backend:
  name: git-gateway
  branch: main

media_folder: uploads
public_folder: /uploads

collections:
  - name: content
    label: Website Content
    files:
      - name: work
        label: Selected Work
        file: content/work.json
        fields:
          - name: services
            label: Services
            widget: list
            summary: "{{fields.name}}"
            fields:
              - {label: Category name (e.g. Graphics Design, Anything you want), name: name, widget: string}
              - {label: Icon emoji (optional, e.g. 🎨), name: icon, widget: string, required: false}
              - name: projects
                label: Projects (subcategories)
                widget: list
                summary: "{{fields.title}}"
                fields:
                  - {label: Title (e.g. Banner, Logo, Social Media), name: title, widget: string}
                  - {label: Link (Drive/YouTube, optional), name: link, widget: string, required: false}
                  - name: images
                    label: Images (upload many)
                    widget: list
                    required: false
                    field: {label: Image, name: image, widget: image}
                  - name: videos
                    label: Videos (mp4, under 25 MB each)
                    widget: list
                    required: false
                    field: {label: Video, name: video, widget: file}

      - name: site
        label: Contact & Stats
        file: content/site.json
        fields:
          - {label: WhatsApp number (with 880, no +), name: whatsapp, widget: string}
          - {label: Email, name: email, widget: string}
          - {label: Facebook page URL, name: facebook, widget: string}
          - {label: Instagram URL, name: instagram, widget: string}
          - {label: Hero photo (transparent PNG, shown in a circle), name: hero_photo, widget: image, required: false}
          - name: stats
            label: Stats
            widget: list
            summary: "{{fields.number}}{{fields.suffix}} {{fields.label}}"
            fields:
              - {label: Number, name: number, widget: number, value_type: int}
              - {label: Suffix, name: suffix, widget: string, default: "+"}
              - {label: Label, name: label, widget: string}
